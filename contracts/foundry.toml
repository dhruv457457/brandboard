[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Monad allows contracts up to 128 KB (the usual limit is 24 KB), and the market is above 24 KB.
code_size_limit = 131072
# PreviewArt.t.sol writes sample cards here when PREVIEW_ART=true.
fs_permissions = [{ access = "read-write", path = "./out-art" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 300
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"

[fmt]
line_length = 110

[lint]
lint_on_build = false
